# One fake GPU. Should schedule on a worker that still has allocatable nvidia.com/gpu.
apiVersion: v1
kind: Pod
metadata:
  name: single-gpu
  namespace: gpu-lab
  labels:
    lab: single-gpu
spec:
  restartPolicy: Never
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: work
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "FAKE_NVIDIA_VISIBLE_DEVICES=${FAKE_NVIDIA_VISIBLE_DEVICES}"
          echo "LAB_FAKE_GPU=${LAB_FAKE_GPU}"
          echo "single-gpu ok"
          sleep 20
      resources:
        limits:
          nvidia.com/gpu: "1"
          cpu: 100m
          memory: 64Mi
        requests:
          nvidia.com/gpu: "1"
          cpu: 50m
          memory: 32Mi
